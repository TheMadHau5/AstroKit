<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AstroFit</title>
        <link rel="stylesheet" href="/static/dist/output.css" />
    </head>
    <body class="p-6 bg-gray-600 flex flex-col min-h-screen">
        <section
            class="text-gray-300 bg-gray-900 body-font rounded-2xl justify-center items-center"
        >
            <div class="px-4 py-10 mx-auto">
                <div class="flex flex-wrap">
                    <div class="p-4 lg:w-full items-center justify-center">
                        <div
                            class="h-full bg-gray-800 space-y-4 bg-opacity-40 px-8 py-16 rounded-lg overflow-hidden text-center relative items-center justify-center"
                        >
                            <div class="columns-2">
                                <div>
                                    <h2
                                        class="title-font text-2xl font-semibold text-white mb-3"
                                        id="title"
                                    >
                                        Bicep Curls
                                    </h2>
                                    <h3 id="reps1" class="text-xl text-gray-300">
                                        Reps: 0/10
                                    </h3>
                                    <progress
                                        class="progress h-10 w-full items-center mx-auto justify-center"
                                        id="progress1"
                                        value="0"
                                        max="10"
                                    ></progress>
                                </div>
                                <div>
                                    <h2
                                        class="title-font text-2xl font-semibold text-white mb-3"
                                        id="title"
                                    >
                                        Jumping Jacks
                                    </h2>
                                    <h3 id="reps2" class="text-xl text-gray-300">
                                        Reps: 0/10
                                    </h3>
                                    <progress
                                        class="progress h-10 w-full items-center mx-auto justify-center"
                                        id="progress2"
                                        value="0"
                                        max="10"
                                    ></progress>
                                </div>
                                <div>
                                    <h2
                                        class="title-font text-2xl font-semibold text-white mb-3"
                                        id="title"
                                    >
                                        Shoulder Press
                                    </h2>
                                    <h3 id="reps3" class="text-xl text-gray-300">
                                        Reps: 0/10
                                    </h3>
                                    <progress
                                        class="progress h-10 w-full items-center mx-auto justify-center"
                                        id="progress3"
                                        value="0"
                                        max="10"
                                    ></progress>
                                </div>
                                <div>
                                    <h2
                                        class="title-font text-2xl font-semibold text-white mb-3"
                                        id="title"
                                    >
                                        Lateral Raises
                                    </h2>
                                    <h3 id="reps4" class="text-xl text-gray-300">
                                        Reps: 0/10
                                    </h3>
                                    <progress
                                        class="progress h-10 w-full items-center mx-auto justify-center"
                                        id="progress4"
                                        value="0"
                                        max="10"
                                    ></progress>
                                </div>
                            </div>
                            <div
                                class="flex flex-row items-center justify-center text-center gap-x-4"
                            >
                                <h3 id="stance" class="text-xl text-gray-300">
                                    Please wait..
                                </h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div
                class="p-2 w-[90%] mx-auto flex space-x-20 items-center justify-center"
            >
                <div class="w-1/4 flex flex-col space-y-10"></div>
                <div
                    class="w-1/2 bg-gray-800 bg-opacity-40 px-4 py-10 mb-2 rounded-lg overflow-hidden text-center relative flex"
                >
                    <img
                        src="{{ url_for('video') }}"
                        class="w-[90%] mx-auto rounded-2xl -scale-x-100"
                    />
                </div>
                <div class="w-1/4 flex flex-col space-y-5">
                    <button
                        class="p-2 bg-gray-600 text-white scale-110 ease-in-out transition duration-200 inline-flex rounded-xl items-center justify-between gap-2"
                    >
                        <a>Render Wireframe</a>
                        <input
                            type="checkbox"
                            class="toggle toggle-success"
                            onchange="toggleWireframe()"
                        />
                    </button>
                    <div
                        class="p-2 bg-gray-600 text-white scale-110 text-center ease-in-out transition duration-200 rounded-xl inline-block items-center justify-center gap-2"
                    >
                        <a class="text-center mb-2">Reps per Set</a>
                        <input
                            type="range"
                            min="5"
                            max="30"
                            value="10"
                            class="range"
                            step="5"
                            onchange="repsPerSet(this.value)"
                        />
                        <div class="w-full flex justify-between text-xs px-2">
                            <span>5</span>
                            <span>10</span>
                            <span>15</span>
                            <span>20</span>
                            <span>25</span>
                            <span>30</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <script>
            let ireps = 10;
            let auto = false;
            let wireframe = false;
            const exercises = {
                curls: "Bicep Curls",
                jacks: "Jumping Jacks",
                press: "Shoulder Press",
                latr: "Lateral Raises"
            };

            async function tick() {
                const response = await fetch('/tick'); // Make an AJAX request to the Flask route that provides direction information
                const directionInfo = await response.json();
                let { stance, reps } = directionInfo;
                if (reps >= ireps) {
                    if (auto) return await nextButton();
                }
                document.getElementById('stance').innerHTML = `Stance: ${stance ? stance : 'N/A'}`;
                for (let i = 0; i < 4; i++) {
                    document.getElementById('reps' + (i+1)).innerHTML = `Sets: ${Math.floor(reps[i] / ireps)} Reps: ${reps[i] % ireps}/${ireps}`;
                    document.getElementById('progress' + (i+1)).value = (reps[i] % ireps).toString();
                }
            }

            function repsPerSet(x) {
                ireps = x;
                for (let i = 0; i < 4; i++) {
                    document.getElementById('progress' + (i+1)).max = ireps.toString();
                }
                tick();
            }

            function updateSetting(body) {
                fetch('/update_setting', {
                    body: JSON.stringify(body),
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                tick();
            }

            function setAuto() {
                auto = !auto;
            }

            function toggleWireframe() {
                wireframe = !wireframe;
                updateSetting({wireframe});
            }

            // Update directions every 1 second
            setInterval(tick, 1000);
        </script>
    </body>
</html>
